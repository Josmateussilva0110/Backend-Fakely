services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fakenews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-fakenews}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Opcional: docker compose --profile api up -d
  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      RELOAD: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fakenews}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fakenews}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
